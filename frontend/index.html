<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Diabetes Risk - test</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<h1>Diabetes Risk - test page</h1>
<p id="health">python: checking...</p>

<fieldset>
  <legend>Clinical</legend>
  <label>age    <input id="age"  type="number" step="any" value="55"></label>
  <label>bmi    <input id="bmi"  type="number" step="any" value="28.4"></label>
  <label>tc     <input id="tc"   type="number" step="any" value="210"></label>
  <label>tg     <input id="tg"   type="number" step="any" value="180"></label>
  <label>hdl    <input id="hdl"  type="number" step="any" value="42"></label>
  <label>ldl    <input id="ldl"  type="number" step="any" value="130"></label>
</fieldset>

<fieldset>
  <legend>Genomic (allele dosage 0 / 1 / 2)</legend>
  <label>kcnj11  <input id="kcnj11"  type="number" min="0" max="2" step="1" value="1"></label>
  <label>tcf7l2  <input id="tcf7l2"  type="number" min="0" max="2" step="1" value="2"></label>
  <label>slc30a8 <input id="slc30a8" type="number" min="0" max="2" step="1" value="0"></label>
  <label>igf2bp2 <input id="igf2bp2" type="number" min="0" max="2" step="1" value="1"></label>
  <label>hhex    <input id="hhex"    type="number" min="0" max="2" step="1" value="0"></label>
  <label>cdkn2a  <input id="cdkn2a"  type="number" min="0" max="2" step="1" value="1"></label>
  <label>kcnq1   <input id="kcnq1"   type="number" min="0" max="2" step="1" value="2"></label>
  <label>cdkal1  <input id="cdkal1"  type="number" min="0" max="2" step="1" value="0"></label>
  <label>fto     <input id="fto"     type="number" min="0" max="2" step="1" value="1"></label>
</fieldset>

<p>
  <button id="btn-both">POST /predict</button>
  <button id="btn-clinical">POST /predict/clinical</button>
  <button id="btn-genomic">POST /predict/genomic</button>
</p>

<h3>sent</h3>
<pre id="sent">-</pre>

<h3>received</h3>
<pre id="got">-</pre>

<script src="/script.js"></script>
</body>
</html>
