<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diabetes Risk - test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="page">

  <header class="hero">
    <div class="hero-text">
      <h1>Diabetes Risk Estimator</h1>
      <p class="sub">Clinical + genomic fusion model — internal test console</p>
    </div>
    <div id="health" class="health-pill health-pending">
      <span class="dot"></span><span class="health-label">checking…</span>
    </div>
  </header>

  <main class="grid">

    <section class="card">
      <div class="card-head">
        <h2>Clinical</h2>
        <span class="badge">6 fields</span>
      </div>
      <div class="field-grid">
        <label class="field"><span>Age</span><input id="age" type="number" step="any" value="55"><small>years</small></label>
        <label class="field"><span>BMI</span><input id="bmi" type="number" step="any" value="28.4"><small>kg/m²</small></label>
        <label class="field"><span>Total cholesterol</span><input id="tc" type="number" step="any" value="210"><small>mg/dL</small></label>
        <label class="field"><span>Triglycerides</span><input id="tg" type="number" step="any" value="180"><small>mg/dL</small></label>
        <label class="field"><span>HDL</span><input id="hdl" type="number" step="any" value="42"><small>mg/dL</small></label>
        <label class="field"><span>LDL</span><input id="ldl" type="number" step="any" value="130"><small>mg/dL</small></label>
      </div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>Genomic</h2>
        <span class="badge">allele dosage 0 / 1 / 2</span>
      </div>
      <div class="field-grid">
        <label class="field"><span>KCNJ11</span><input id="kcnj11" type="number" min="0" max="2" step="1" value="1"></label>
        <label class="field"><span>TCF7L2</span><input id="tcf7l2" type="number" min="0" max="2" step="1" value="2"></label>
        <label class="field"><span>SLC30A8</span><input id="slc30a8" type="number" min="0" max="2" step="1" value="0"></label>
        <label class="field"><span>IGF2BP2</span><input id="igf2bp2" type="number" min="0" max="2" step="1" value="1"></label>
        <label class="field"><span>HHEX</span><input id="hhex" type="number" min="0" max="2" step="1" value="0"></label>
        <label class="field"><span>CDKN2A</span><input id="cdkn2a" type="number" min="0" max="2" step="1" value="1"></label>
        <label class="field"><span>KCNQ1</span><input id="kcnq1" type="number" min="0" max="2" step="1" value="2"></label>
        <label class="field"><span>CDKAL1</span><input id="cdkal1" type="number" min="0" max="2" step="1" value="0"></label>
        <label class="field"><span>FTO</span><input id="fto" type="number" min="0" max="2" step="1" value="1"></label>
      </div>
    </section>

  </main>

  <div class="actions">
    <button id="btn-both" class="btn btn-primary">Predict — both</button>
    <button id="btn-clinical" class="btn">Clinical only</button>
    <button id="btn-genomic" class="btn">Genomic only</button>
  </div>

  <div id="result-cards" class="result-cards" hidden></div>

  <section class="io-grid">
    <div class="io-block">
      <h3>sent</h3>
      <pre id="sent">-</pre>
    </div>
    <div class="io-block">
      <h3>received</h3>
      <pre id="got">-</pre>
    </div>
  </section>

</div>

<script src="/script.js"></script>
</body>
</html>
